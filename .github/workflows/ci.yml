name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"

      - name: Run Pytest
        run: |
          uv run pytest -m "" --cov=src/zotero_arxiv_daily --cov-report=term-missing
