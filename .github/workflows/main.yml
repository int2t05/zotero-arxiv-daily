name: Daily digest site
on:
  workflow_dispatch:
    inputs:
      deploy_only:
        description: '跳过管线, 直接用仓库已提交的 site/daily 构建发布(改站点样式/icon 时用)'
        type: boolean
        default: false
      refresh_today:
        description: '从当天已存日报重新生成结构化速览并覆盖（不访问 arXiv）'
        type: boolean
        default: false
  schedule:
    - cron: '17 22 * * *'

jobs:
  # 阶段一: 跑管线生成每日 MD 并提交(耗时长; 失败只影响本段)
  digest:
    if: ${{ inputs.deploy_only != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          REFRESH_TODAY: ${{ inputs.refresh_today }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          if [ "$REFRESH_TODAY" = "true" ]; then
            uv run src/zotero_arxiv_daily/main.py executor.refresh_today_from_digest=true
          else
            uv run src/zotero_arxiv_daily/main.py
          fi

      - name: Ensure digest file (empty-day placeholder)
        run: |
          f="site/daily/$(date -u +%F).md"
          if [ ! -f "$f" ]; then
            mkdir -p site/daily
            printf '# 每日 arXiv 精选 · %s\n\n> 今日无匹配的新论文（或数据源暂不可用）。\n' "$(date -u +%F)" > "$f"
            echo "Placeholder digest written: $f"
          fi

      - name: Commit daily digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # CI 覆写了被跟踪的 config/custom.yaml，先还原避免脏树阻断 pull --rebase（并发推送保护）
          git restore config/custom.yaml
          git add site/daily
          git diff --cached --quiet || git commit -m "daily digest $(date -u +%F)"
          git pull --rebase origin main
          git push

  # 阶段二：VitePress 构建并上传 Pages artifact
  build:
    needs: digest
    if: ${{ !cancelled() && (needs.digest.result == 'success' || inputs.deploy_only == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7.0.1
        with:
          ref: main   # digest 已把每日 MD 推上 main；dispatch 默认 SHA 可能较旧

      - name: Generate index
        run: |
          {
            echo "# 每日 arXiv 精选"
            echo
            echo "基于 Zotero 兴趣画像与 LLM 打分的每日 arXiv 论文推送。"
            echo
            for f in $(ls site/daily/*.md 2>/dev/null | sort -r); do
              b=$(basename "$f" .md)
              echo "- [$b](/daily/$b)"
            done
          } > site/index.md

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Install and build VitePress
        run: |
          npm install --no-fund --no-audit
          npx vitepress build site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site/.vitepress/dist

  # 阶段三：单独部署，避免上传 artifact 后立即查询产生竞态
  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
